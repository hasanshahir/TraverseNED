<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="origin" />
  <title>TraverseNED — Real-Time Campus GPS & Navigation</title>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet 1.9.4 CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app-shell">
    <!-- 1. FULL-VIEWPORT INTERACTIVE CAMPUS MAP -->
    <div id="campus-map" role="application" aria-label="NED University Main Campus Map"></div>

    <!-- 2. TOP FLOATING SEARCH & REAL-TIME STATUS BAR -->
    <div class="top-overlay-container">
      <div class="search-card">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="campus-search" placeholder="Search department, block, or facility..." autocomplete="off" />
          <button id="clear-search" class="icon-btn hidden" title="Clear">✕</button>
        </div>
        <!-- Suggestions dropdown -->
        <ul id="search-results" class="search-dropdown hidden" role="listbox"></ul>
      </div>

      <div class="top-meta-row">
        <!-- Real-Time Geofence Status Badge -->
        <div id="geofence-badge" class="status-badge outside">
          <span class="status-indicator"></span>
          <span id="geofence-text">Off Campus — Static Mode</span>
        </div>

        <!-- Layer Switcher Pill -->
        <div class="layer-pill-bar" role="group" aria-label="Map Layer Toggle">
          <button class="layer-toggle-btn active" data-layer="street">Campus</button>
          <button class="layer-toggle-btn" data-layer="satellite">Satellite</button>
          <button class="layer-toggle-btn" data-layer="masterplan">Plan</button>
        </div>
      </div>
    </div>

    <!-- 3. FLOATING ACTION BUTTONS (FABS) -->
    <div class="fab-container">
      <button id="btn-recenter" class="fab" title="Recenter to My Location">🎯</button>
      <button id="btn-walk-graph" class="fab" title="Toggle Walkway Graph">🌐</button>
      <button id="btn-emergency" class="fab emergency" title="Fastest Safe Exit">🚨</button>
    </div>

    <!-- 4. EXPANDABLE BOTTOM SHEET (NAVIGATION CARD) -->
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="sheet-drag-handle" id="sheet-drag-handle"></div>

      <div class="sheet-header">
        <div class="brand-row">
          <span class="brand-badge">TraverseNED</span>
          <div id="route-meta" class="route-meta">
            <div class="eta-time" id="route-time">-- min</div>
            <div class="eta-dist" id="route-dist">-- m</div>
          </div>
        </div>
        <div class="header-action-btns">
          <button id="btn-simulate-walk" class="btn-walk-action" title="Simulate Walk">▶ Walk</button>
          <button id="btn-close-route" class="btn-text hidden">End Route</button>
        </div>
      </div>

      <!-- Quick Action Shortcuts -->
      <div class="quick-pill-row">
        <button class="action-pill" data-quick="main-gate">🚪 Main Gate</button>
        <button class="action-pill" data-quick="cafe">☕ Nearest Cafe</button>
        <button class="action-pill" data-quick="library">📚 Library</button>
        <button class="action-pill" data-quick="admin">🏛️ Admin Block</button>
      </div>

      <div class="sheet-inputs" id="navigation-inputs">
        <div class="input-row">
          <span class="dot origin"></span>
          <select id="select-origin">
            <option value="GPS_CURRENT">📍 My Real-Time Location</option>
          </select>
        </div>
        <div class="input-row">
          <span class="dot destination"></span>
          <select id="select-destination">
            <option value="" disabled selected>Choose destination...</option>
          </select>
        </div>
      </div>

      <div id="turn-by-turn-container" class="turn-instructions-panel">
        <div class="steps-heading">
          <span>Turn-by-Turn Directions</span>
          <span id="steps-count-badge" class="steps-count-pill">0 steps</span>
        </div>
        <ul id="steps-list" class="steps-list"></ul>
      </div>
    </div>
  </main>

  <!-- Leaflet 1.9.4 JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Application Modules -->
  <script src="data/campus_nodes.js"></script>
  <script src="js/router.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
